services:
  radar-plotter:
    build:
      context: .
      dockerfile: Dockerfile
    image: radar-plotter:local
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: radar:jobs
      REDIS_GROUP: radar-plotter
      REDIS_MAX_ATTEMPTS: "3"
      PLOT_TIMEOUT: "900"
      PLOTTER_CONCURRENCY: "2"
      PLOTTER_AUTOMATIC_DZB_ONLY: "true"
      REDIS_SOCKET_TIMEOUT: "15"
      PARTIAL_VOLUME_POLICY: ${PARTIAL_VOLUME_POLICY:-skip}
      MIN_VOLUME_SWEEPS: ${MIN_VOLUME_SWEEPS:-3}
      PLOTTER_HEARTBEAT_TTL: "30"
      XDG_CACHE_HOME: /app/cache
      MPLCONFIGDIR: /app/cache/matplotlib
      USE_BASEMAP_TILES: ${USE_BASEMAP_TILES:-false}
      MAPTILER_TILE_URL: ${MAPTILER_TILE_URL:-}
    volumes:
      - /mnt/qnap_radar:/mnt/qnap_radar:ro
      - /home/twl/apps/radar-plotter/output:/app/output
      - /home/twl/apps/radar-plotter/cache:/app/cache
    networks:
      - radar-pipeline
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


networks:
  radar-pipeline:
    external: true
    name: radar-pipeline
