name: pyart_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - numpy=2.5.1
  - scipy=1.18.0
  - matplotlib=3.11.1
  - netcdf4=1.7.4
  - pillow=12.3.0
  - pyproj=3.7.2
  - wradlib=2.9.5
  - cartopy=0.25.0
  - arm_pyart=2.2.5
  - xarray=2026.7.0
  - xradar=0.12.0
  - redis-py=8.1.0
  - mda-xdrlib
  - pip
  - cmweather=0.3.2
  - pip:
      - wheel
      - watchdog
      - flake8
      - tox
      - coverage
      - Sphinx
      - twine
      - pytest
      - black
      - isort
      - pre_commit
