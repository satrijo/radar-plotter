name: pyart_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - numpy
  - scipy
  - matplotlib
  - netcdf4
  - pillow
  - pyproj
  - wradlib
  - cartopy
  - arm_pyart
  - xarray
  - xradar
  - redis-py
  - mda-xdrlib
  - pip
  - cmweather
  - pip:
      - wheel
      - watchdog
      - flake8
      - tox
      - coverage
      - Sphinx
      - twine
      - pytest
      - black
      - isort
      - pre_commit
